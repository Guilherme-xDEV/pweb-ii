<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Lista 01 - JavaScript
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            background-color: blanchedalmond;
            width: 20%;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            gap: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        label {
            margin-bottom: 10px;
        }
    </style>

</head>
<body>
    <form>

        <p>Conversor real para dólar</p>

        <label for="questao-2-a">Questão 2 - A</label>
        <input type="number" id="questao-2-a" name="questao-2-a">
        <button type="submit" onclick="document.getElementById('resultado-questao-2-a').innerHTML = converter_cotacao_reais(document.getElementById('questao-2-a').value)">Enviar</button>
        <p id="resultado-questao-2-a"></p>
    </form>

    <br>
    <form>

        <p>Cálculo de perímetro pelo raio</p>

        <label for="questao-2-b">Questão 2 - B</label>
        <input type="number" id="questao-2-b" name="questao-2-b">
            <button type="submit" onclick="calcular_perimetro(document.getElementById('questao-2-b').value)">Enviar</button>
        <p id="resultado-questao-2-b"></p>
    </form>
    
    <br>
    <form>

        <p>Cálculo nota final</p>

        <label for="questao-2-c">Questão 2 - C</label>
        <input type="number" id="questao-2-c" name="questao-2-c">
        <input type="number" id="questao-2-c" name="questao-2-c">
        <button type="submit" onclick="calcular_nota_final(document.getElementById('questao-2-c').value, document.getElementById('questao-2-c').value)">Enviar</button>
        <p id="resultado-questao-2-c"></p>
    </form>
    
    <br>
    <form>

        <p>soma de primos</p>

        <label for="questao-2-d">Questão 2 - D</label>
        <input type="number" id="questao-2-d" name="questao-2-d">
        <button type="submit" onclick="validacao_primo(document.getElementById('questao-2-d').value)">Enviar</button>
        <p id="resultado-questao-2-d"></p>
    </form>
    
</body>
</html>
