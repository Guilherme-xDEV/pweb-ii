<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Lista 01 - JavaScript
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            background-color: blanchedalmond;
            width: 20%;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            gap: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        label {
            margin-bottom: 10px;
        }
    </style>

</head>
<body>

    <h3>Questões 2 a - d</h3>
    <form id="form-questao-2-a">

        <p>Conversor real para dólar</p>

        <label for="questao-2-a">Questão 2 - A</label>
        <input type="number" id="questao-2-a" name="questao-2-a">
        <button type="submit">Enviar</button>
        <p id="resultado-questao-2-a"></p>
    </form>

    <br>
    <form id="form-questao-2-b">

        <p>Cálculo de perímetro pelo raio</p>

        <label for="questao-2-b">Questão 2 - B</label>
        <input type="number" id="questao-2-b" name="questao-2-b">
        <button type="submit">Enviar</button>
        <p id="resultado-questao-2-b"></p>
    </form>
    
    <br>
    <form id="form-questao-2-c">

        <p>Cálculo nota final</p>

        <label for="questao-2-c-1">Nota N1</label>
        <input type="number" id="questao-2-c-1" name="questao-2-c-1">
        <label for="questao-2-c-2">Nota N2</label>
        <input type="number" id="questao-2-c-2" name="questao-2-c-2">
        <button type="submit">Enviar</button>
        <p id="resultado-questao-2-c"></p>
    </form>
    
    <br>
    <form id="form-questao-2-d">

        <p>soma de primos</p>

        <label for="quantidade-numeros">Quantidade de números:</label>

        <input type="number" id="quantidade-numeros" min="1">

        <label for="numeros">Números:</label>
        <input type="text" id="numeros" placeholder="Ex: 2, 4, 5, 7, 10">
        <button type="submit">Calcular</button>
        <p id="resultado-questao-2-d"></p>
    </form>

    <h3>Questões 3 a - f</h3>

    <form id="form-questao-3-a">
        <label for="num1">informe o 1º número</label>
        <input type="number" id="num1">

        <label for="num2">informe o 2º número</label>
        <input type="number" id="num2">

        <label for="operacao">informe a operação</label>
        <input type="text" id="operacao">

        <button type="submit">Realizar Operação</button>

        <p id="resultado-questao-3-a"></p>

    </form>

    <form id="form-questao-3-b">

        <p>multiplicação de n números</p>

        <label for="qtd-valores">Quantidade de números:</label>

        <input type="number" id="qtd-valores" min="1">

        <label for="produto">Números:</label>
        <input type="text" id="produto" placeholder="Ex: 2, 4, 5, 7, 10">
        <button type="submit">Calcular</button>
        <p id="resultado-questao-3-b"></p>
    
    </form>

    <form id="form-questao-3-c">

        <p>fatorial recursivo</p>

        <label for="fatorial">Número:</label>
        <input type="text" id="fatorial" placeholder="Ex: 4">
        <button type="submit">Calcular</button>
        <p id="resultado-questao-3-c"></p>
    
    </form>

    <form id="form-questao-3-d">

        <p> cálculo de valor total</p>

        <label for="preco-unitario">informe o valor unitário do produto</label>
        <input type="number" id="preco-unitario">

        <label for="quantidade-ordenada">informe a quantidade ordenada</label>
        <input type="number" id="quantidade-ordenada">

        <label for="desconto">houve desconto? informe em %</label>
        <input type="number" id="desconto" placeholder="50 se 50%">

        <button type="submit">Ver valor</button>

        <p id="resultado-questao-3-d"></p>

    </form>

    <h1>Conta Bancária</h1>

    <p id="saldo"></p>

    <button id="depositar">Depositar R$ 100</button>
    <button id="sacar">Sacar R$ 200</button>
    <p id="erro"></p>
    
    <script src="questao-2-a.js"></script>
    <script src="questao-2-b.js"></script>
    <script src="questao-2-c.js"></script>
    <script src="questao-2-d.js"></script>

    <script src="questao-3-a.js"></script>
    <script defer src="questao-3-b.js"></script>
    <script src="questao-3-c.js"></script>
    <script src="questao-3-d.js"></script>
    <script src="questao-3-f.js"></script>
</body>
</html>
