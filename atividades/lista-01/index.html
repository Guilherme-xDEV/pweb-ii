<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Lista 01 - JavaScript
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            background-color: blanchedalmond;
            width: 20%;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            gap: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        label {
            margin-bottom: 10px;
        }
    </style>

</head>
<body>
    <form id="form-questao-2-a">

        <p>Conversor real para dólar</p>

        <label for="questao-2-a">Questão 2 - A</label>
        <input type="number" id="questao-2-a" name="questao-2-a">
        <button type="submit">Enviar</button>
        <p id="resultado-questao-2-a"></p>
    </form>

    <br>
    <form id="form-questao-2-b">

        <p>Cálculo de perímetro pelo raio</p>

        <label for="questao-2-b">Questão 2 - B</label>
        <input type="number" id="questao-2-b" name="questao-2-b">
        <button type="submit">Enviar</button>
        <p id="resultado-questao-2-b"></p>
    </form>
    
    <br>
    <form id="form-questao-2-c">

        <p>Cálculo nota final</p>

        <label for="questao-2-c-1">Nota N1</label>
        <input type="number" id="questao-2-c-1" name="questao-2-c-1">
        <label for="questao-2-c-2">Nota N2</label>
        <input type="number" id="questao-2-c-2" name="questao-2-c-2">
        <button type="submit">Enviar</button>
        <p id="resultado-questao-2-c"></p>
    </form>
    
    <br>
    <form id="form-questao-2-d">

        <p>soma de primos</p>

        <label for="quantidade-numeros">Quantidade de números:</label>

        <input type="number" id="quantidade-numeros" min="1">

        <label for="numeros">Números:</label>
        <input type="text" id="numeros" placeholder="Ex: 2, 4, 5, 7, 10">
        <button type="submit">Calcular</button>
        <p id="resultado-questao-2-d"></p>
    </form>
    
    <script src="questao-2-a.js"></script>
    <script src="questao-2-b.js"></script>
    <script src="questao-2-c.js"></script>
    <script src="questao-2-d.js"></script>

</body>
</html>
