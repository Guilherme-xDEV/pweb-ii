<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            background: #1a1a1a;
        }
        #overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            z-index: 10;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="overlay">
            <div><strong>Controls</strong></div>
            <div>Arrow Left / Right: move</div>
            <div>Space: jump</div>
            <div>Ctrl: shoot</div>
            <div>R: reset</div>
        </div>
        <canvas id="game-canvas"></canvas>
    </div>

    <script src="Player.js"></script>
    <script src="Level.js"></script>
    <script src="Enemy.js"></script>
    <script src="Bullet.js"></script>
    <script src="Game.js"></script>
    <script src="utils.js"></script>
    <script src="main.js"></script>
</body>
</html>
